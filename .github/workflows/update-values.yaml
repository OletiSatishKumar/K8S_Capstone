name: Update Values.yaml with New Image Tag

on:
  repository_dispatch:
    types: [update_infra]

jobs:
  update-values:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Infra Repo
      uses: actions/checkout@v3
      with:
        ref: main  # Or the branch where your Helm chart is located

    - name: Update image tag in dev-values.yaml
      run: |
        TAG=${{ github.event.client_payload.tag }}
        echo "Updating image tag to $TAG"

        # Update the dev-values.yaml with the new tag
        sed -i "s/tag: .*/tag: $TAG/" helm/flowershop/dev-values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add helm/flowershop/dev-values.yaml
        git commit -m "Update image tag to $TAG"
        git push origin main  # Or the branch you're working on
